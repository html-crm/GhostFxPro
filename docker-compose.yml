services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - gfp-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - API_URL=http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Offline ML trainer for exit decisions. Runs the labeled dataset through
  # logistic regression and hands the resulting model back to the API/bot.
  # Not on the live trading path; never receives exchange credentials.
  ml:
    build:
      context: ./ml
    environment:
      - ML_PORT=8080
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  gfp-data:

